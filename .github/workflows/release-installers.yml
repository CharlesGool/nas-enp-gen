name: Build release installers

# Builds the generator as a .deb (Linux) and .exe (Windows) and attaches
# both to the GitHub Release for the pushed tag. Only runs on version tags
# (vX.Y.Z) — never on plain commits to main.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: bash packaging/build-deb.sh "${{ steps.ver.outputs.version }}" python3

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: nas-enp-gen_*.deb

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .exe
        run: pyinstaller packaging/nas-enp-gen.spec

      - name: Upload .exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nas-enp-gen.exe
